<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidStore Omni v3 (Proxy Fixed)</title>
    <style>
        :root { --discord: #7289da; --bg: #23272a; --panel: #2c2f33; --text: #ffffff; --green: #43b581; --red: #f04747; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--panel); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; margin-bottom: 10px; transition: 0.2s; }
        .btn-start { background: var(--green); }
        .btn-stop { background: var(--red); }
        .btn-sync { background: var(--discord); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        video { width: 100%; border-radius: 8px; background: #000; margin-top: 10px; }
        #log { font-family: monospace; font-size: 0.75rem; background: #000; padding: 10px; border-radius: 5px; margin-top: 15px; height: 160px; overflow-y: auto; color: #00ff00; border: 1px solid #444; }
        .hidden { display: none; }
        h2 { text-align: center; font-size: 1.2rem; margin-top: 0; color: var(--discord); }
    </style>
</head>
<body>

<div class="container">
    <h2>VIDSTORE OMNI CONTROL</h2>
    
    <div id="sender-ui">
        <video id="preview" autoplay muted playsinline></video>
        <button id="record-toggle" class="btn-start">START CAPTURE</button>
    </div>
    
    <div style="height: 1px; background: #444; margin: 20px 0;"></div>
    
    <button id="sync-btn" onclick="fetchAndAssemble()" class="btn-sync">PC: DOWNLOAD & STITCH</button>
    <video id="final-video" class="hidden" controls></video>

    <div id="log">System initialized. Waiting for input...</div>
</div>

<script>
    // --- SETTINGS ---
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1497671483311521862/KfatluGXWN1gq7tH-U13Q4E4_QtwPBLwjy016CJcfLTHdhmifRX7uCFnRzEHeUYLSSRO';
    const BOT_TOKEN = 'MTQ5NzY3MTc1NjU0OTMyNDg1Mg.GopxTB.Skz7-rOHwZwfSR-KncvZecVEMe9BLHUiHt8CoY'; 
    const CHANNEL_ID = '1497671315585368086';
    const PROXY = "https://corsproxy.io/?";

    // 5.5MB Video -> ~7.4MB JSON (Safe for Discord 8MB)
    const MAX_VIDEO_BLOB_SIZE = 5.5 * 1024 * 1024; 
    const MAX_TIME = 6000; // 6 seconds

    let stream, recorder, isRecording = false, chunkCount = 0, currentSessionId = "";
    const log = (m) => { const l = document.getElementById('log'); l.innerHTML += `> ${m}<br>`; l.scrollTop = l.scrollHeight; };

    // --- SENDER CORE ---
    document.getElementById('record-toggle').onclick = async () => {
        if (!isRecording) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720, frameRate: 30 }, 
                    audio: true 
                });
                document.getElementById('preview').srcObject = stream;
                isRecording = true;
                chunkCount = 0;
                currentSessionId = "SID-" + Date.now();
                
                document.getElementById('record-toggle').innerText = "STOP RECORDING";
                document.getElementById('record-toggle').className = "btn-stop";
                
                log("VIDEO STARTED");
                await sendStatus("START");
                startCycle();
            } catch (e) { log("Error: " + e.message); }
        } else {
            isRecording = false;
            if (recorder) recorder.stop();
            stream.getTracks().forEach(t => t.stop());
            document.getElementById('record-toggle').innerText = "START CAPTURE";
            document.getElementById('record-toggle').className = "btn-start";
            log("VIDEO ENDED");
            await sendStatus("END");
        }
    };

    function startCycle() {
        if (!isRecording) return;

        recorder = new MediaRecorder(stream, { 
            mimeType: 'video/webm;codecs=vp8',
            videoBitsPerSecond: 2500000 
        });

        let chunks = [];
        let startTime = Date.now();

        recorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
                chunks.push(e.data);
                let currentBlob = new Blob(chunks);
                if (currentBlob.size >= MAX_VIDEO_BLOB_SIZE || (Date.now() - startTime) >= MAX_TIME) {
                    recorder.stop();
                }
            }
        };

        recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            if (blob.size > 0) upload(blob);
            if (isRecording) startCycle();
        };

        recorder.start(1000); 
    }

    async function upload(blob) {
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async () => {
            const base64 = reader.result.split(',')[1];
            const payload = { type: "DATA", sid: currentSessionId, part: chunkCount++, data: base64 };
            
            const formData = new FormData();
            formData.append('file', new Blob([JSON.stringify(payload)], {type:'application/json'}), `c_${chunkCount}.json`);
            
            try {
                await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
                log(`Part ${chunkCount} Sent (${Math.round(blob.size/1024)}KB)`);
            } catch (e) { log("Chunk Failed to Send"); }
        };
    }

    async function sendStatus(type) {
        const payload = { type: type, sid: currentSessionId, ts: Date.now() };
        const formData = new FormData();
        formData.append('file', new Blob([JSON.stringify(payload)], {type:'application/json'}), `status_${type}.json`);
        return fetch(WEBHOOK_URL, { method: 'POST', body: formData });
    }

    // --- PC RECEIVER (WITH PROXY) ---
    async function fetchAndAssemble() {
    const syncBtn = document.getElementById('sync-btn');
    syncBtn.disabled = true;
    log("Requesting data through AllOrigins...");

    try {
        const apiUrl = `https://discord.com/api/v10/channels/${CHANNEL_ID}/messages?limit=100`;
        // AllOrigins wraps the response in a JSON object to bypass browser security
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Proxy failed.");
        
        const wrapper = await response.json();
        // The real Discord data is inside wrapper.contents, but it's a string
        const messages = JSON.parse(wrapper.contents);
        
        let dataChunks = [];
        log("Looking for video parts...");

        for (let m of messages) {
            if (!m.attachments) continue;
            for (let a of m.attachments) {
                if (a.filename.startsWith('c_')) {
                    // Download the actual JSON file content
                    const fileProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(a.url)}`;
                    const fileRes = await fetch(fileProxy);
                    const fileWrapper = await fileRes.json();
                    const d = JSON.parse(fileWrapper.contents);
                    dataChunks.push(d);
                }
            }
        }

        if (dataChunks.length === 0) {
            log("No chunks found. Check your Channel ID.");
            syncBtn.disabled = false;
            return;
        }

        dataChunks.sort((a, b) => a.part - b.part);
        log(`Assembling ${dataChunks.length} chunks...`);

        const binary = dataChunks.map(c => {
            const s = atob(c.data);
            const b = new Uint8Array(s.length);
            for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
            return b;
        });

        const v = document.getElementById('final-video');
        v.src = URL.createObjectURL(new Blob(binary, { type: 'video/webm' }));
        v.classList.remove('hidden');
        log("SUCCESS! Video is ready.");
    } catch (e) {
        log("Error: " + e.message);
        console.error(e);
    } finally {
        syncBtn.disabled = false;
    }
}
}
</script>
</body>
</html>
